<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWF Study Guide 2026 — Sustainability Programs in Switzerland</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',-apple-system,sans-serif;background:#f5f5f0;min-height:100vh;color:#333}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

.filters-wrap{max-width:1200px;margin:24px auto 0;padding:0 24px;position:relative;z-index:10}
.filters-card{background:#fff;border-radius:8px;padding:24px 28px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.search-input{width:100%;padding:12px 16px;border:1px solid #ccc;border-radius:4px;font-size:15px;font-family:'Montserrat',sans-serif;outline:none;transition:border-color .2s;background:#fafafa;margin-bottom:20px}
.search-input:focus{border-color:#2d4a27;background:#fff}
.search-input::placeholder{color:#aaa}
.filters-row{display:flex;gap:14px;flex-wrap:wrap}
.filter-group{flex:1 1 180px;min-width:150px}
.filter-label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#2d4a27;margin-bottom:5px}
.filter-select{width:100%;padding:9px 12px;border:1px solid #ccc;border-radius:4px;font-size:13px;font-family:'Montserrat',sans-serif;background:#fff;color:#333;cursor:pointer;outline:none;transition:border-color .2s}
.filter-select:focus{border-color:#2d4a27}
.filter-actions{margin-top:14px;display:flex;align-items:center;gap:12px}
.filter-actions span{font-size:13px;color:#888}
.btn-clear{background:#2d4a27;border:none;border-radius:4px;padding:5px 14px;font-size:12px;color:#fff;cursor:pointer;font-family:'Montserrat',sans-serif;font-weight:600;transition:background .2s}
.btn-clear:hover{background:#2d4a29}

.results-wrap{max-width:1200px;margin:24px auto 0;padding:0 24px 60px}
.results-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.results-count{font-size:14px;font-weight:600;color:#666}
.results-badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 10px;border-radius:3px;font-weight:600;white-space:nowrap;color:#fff}

.programs-list{display:flex;flex-direction:column;gap:10px}
.program-card{position:relative;background:#fff;border-radius:6px;border:1px solid #e0e0d8;overflow:hidden;transition:box-shadow .2s,transform .15s;cursor:pointer}
.program-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.card-inner{padding:18px 22px;padding-right:44px}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card-main{flex:1;min-width:200px}
.card-title{margin:0 0 6px;font-size:15px;font-weight:700;color:#2a2a2a;line-height:1.35}
.card-title a{color:#2a2a2a;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
.card-title a:hover{color:#2d4a27;border-bottom-color:#2d4a27}
.card-uni-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-uni{font-size:13px;font-weight:600;color:#2d4a27}
.type-badge{font-size:10px;padding:2px 8px;border-radius:3px;font-weight:600}
.type-uni{background:#eee8f5;color:#6b4f8a}
.type-fh{background:#e5f0fa;color:#3a6d9e}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.tag-level{font-size:11px;font-weight:700;padding:3px 10px;border-radius:3px;white-space:nowrap}
.tag-lang{font-size:11px;font-weight:600;padding:3px 10px;border-radius:3px;background:#f0f0ea;color:#666;white-space:nowrap}
.tag-lang-add{opacity:.55;font-weight:400}

.card-bottom-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.card-discs{display:flex;gap:4px;flex-wrap:wrap}
.disc-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:3px;background:#f0f4ee;color:#5a7d4f}

.it-icons{display:flex;gap:6px;align-items:center;flex-shrink:0}
.it-icon{position:relative;display:inline-flex;align-items:center;padding:4px 6px;border-radius:5px;cursor:help}
.it-icon-pract{background:#ecf5f0;border:1px solid #b8dcc8}
.it-icon-inter{background:#faf7ec;border:1px solid #e8e0b8}
.it-icon .it-tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:10px;font-weight:500;padding:5px 10px;border-radius:4px;white-space:nowrap;z-index:50;pointer-events:none}
.it-icon .it-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:#333}
.it-icon:hover .it-tip{display:block}

.card-details{margin-top:14px;padding-top:14px;border-top:1px solid #eee;animation:fadeIn .25s ease}
.card-desc{margin:0 0 10px;font-size:13px;line-height:1.65;color:#444}
.card-pract{background:#f8f8f4;border-radius:4px;padding:10px 14px;border:1px solid #e8e8e0;margin-bottom:10px}
.card-pract-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#999}
.card-pract p{margin:4px 0 0;font-size:12px;color:#555;line-height:1.5}
.btn-website{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;background:#2d4a27;color:#fff;border-radius:4px;font-size:12px;font-weight:600;text-decoration:none;transition:background .2s;font-family:'Montserrat',sans-serif}
.btn-website:hover{background:#3a6030}
.btn-website svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}
.card-hint{text-align:right;margin-top:6px;font-size:11px;color:#bbb}

.empty{text-align:center;padding:60px 20px;color:#999}
.empty .ico{font-size:40px;margin-bottom:12px}
.empty h3{font-size:15px;font-weight:600;margin-bottom:6px}
.empty p{font-size:13px}

.loading{text-align:center;padding:80px 20px}
.loading .spinner{width:36px;height:36px;border:3px solid #e0e0d8;border-top-color:#2d4a27;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
.loading p{font-size:14px;color:#2d4a27;font-weight:500}
.loading .sub{font-size:12px;color:#aaa;margin-top:4px}

.error-box{max-width:550px;margin:40px auto;padding:24px;background:#fff;border:1px solid #e0e0d8;border-radius:6px;text-align:center}
.error-box h3{color:#c0392b;margin-bottom:8px;font-size:16px}
.error-box p{font-size:13px;color:#666;line-height:1.6}

.multi-select{position:relative}
.multi-btn{width:100%;padding:9px 12px;border:1px solid #ccc;border-radius:4px;font-size:13px;font-family:'Montserrat',sans-serif;background:#fff;color:#333;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center}
.multi-btn:focus{border-color:#2d4a27;outline:none}
.multi-btn .arrow{font-size:10px;color:#999}
.multi-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;border-top:none;border-radius:0 0 4px 4px;max-height:200px;overflow-y:auto;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.multi-dropdown.open{display:block}
.multi-dropdown label{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;cursor:pointer;transition:background .15s}
.multi-dropdown label:hover{background:#f5f5f0}
.multi-dropdown input[type="checkbox"]{accent-color:#2d4a27}

.lang-sub{margin-top:6px;display:none}
.lang-sub.visible{display:block}
.lang-sub .filter-label{font-size:10px;color:#888;margin-bottom:3px}

/* Favorites */
.fav-star{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;padding:4px;z-index:5;transition:transform .2s}
.fav-star:hover{transform:scale(1.2)}
.fav-star svg{width:22px;height:22px;stroke:#ccc;stroke-width:2;fill:none;transition:all .2s}
.fav-star.active svg{fill:#e8b83d;stroke:#d4a030}
.program-card.faved{border-color:#e8d8a0;background:#fffdf5;box-shadow:inset 4px 0 0 #e8b83d}
.fav-star:hover svg{stroke:#d4a030}

.fav-bar{position:sticky;top:0;z-index:20;background:#fffdf5;border:1px solid #e8d8a0;border-radius:6px;padding:8px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:all .3s}
.fav-bar.hidden{display:none}
.btn-fav-toggle{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:4px;font-size:12px;font-weight:600;font-family:'Montserrat',sans-serif;cursor:pointer;transition:all .2s;border:1px solid #d4a030;background:#fff;color:#b8860b}
.btn-fav-toggle:hover{border-color:#d4a030;color:#d4a030}
.btn-fav-toggle.active{background:#fdf6e3;border-color:#d4a030;color:#b8860b}
.btn-fav-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.btn-fav-toggle.active svg{fill:#e8b83d}
.fav-count{font-size:11px;background:#e8b83d;color:#fff;border-radius:10px;padding:1px 7px;font-weight:700;min-width:18px;text-align:center}

@media(max-width:600px){
  .filters-wrap,.results-wrap{padding:0 12px}
  .filters-card{padding:16px}
  .card-inner{padding:14px}
  .filter-group{flex:1 1 100%}
  .results-wrap{padding-bottom:40px}
}
</style>
</head>
<body>

<div class="filters-wrap">
  <div class="filters-card">
    <input type="text" id="search" class="search-input" placeholder="Search programs, universities, or topics...">
    <div class="filters-row">
      <div class="filter-group"><label class="filter-label">Level</label><select id="fLevel" class="filter-select"><option value="">All</option></select></div>
      <div class="filter-group"><label class="filter-label">Discipline</label><div class="multi-select" id="msDisc"><button type="button" class="multi-btn" onclick="toggleDrop('msDisc')"><span id="msDiscLabel">All</span><span class="arrow">&#9660;</span></button><div class="multi-dropdown" id="msDiscDrop"></div></div></div>
      <div class="filter-group"><label class="filter-label">University Type</label><select id="fType" class="filter-select"><option value="">All</option></select></div>
      <div class="filter-group"><label class="filter-label">Region</label><div class="multi-select" id="msRegion"><button type="button" class="multi-btn" onclick="toggleDrop('msRegion')"><span id="msRegionLabel">All</span><span class="arrow">&#9660;</span></button><div class="multi-dropdown" id="msRegionDrop"></div></div></div>
      <div class="filter-group">
        <label class="filter-label">Main Language</label>
        <select id="fMainLang" class="filter-select"><option value="">All</option></select>
        <div class="lang-sub" id="langSubWrap">
          <label class="filter-label">Additional Languages</label>
          <div class="multi-select" id="msAddLang">
            <button type="button" class="multi-btn" onclick="toggleDrop('msAddLang')"><span id="msAddLangLabel">Any</span><span class="arrow">&#9660;</span></button>
            <div class="multi-dropdown" id="msAddLangDrop"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="filter-actions" id="fActions" style="display:none">
      <span id="fCount"></span>
      <button class="btn-clear" onclick="clearAll()">Clear all</button>
    </div>
  </div>
</div>

<div class="results-wrap">
  <div class="fav-bar hidden" id="favBar">
    <button class="btn-fav-toggle" id="btnFavToggle" onclick="toggleFavMode()">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span id="favLabel">Show only favorites</span>
      <span class="fav-count" id="favCount" style="display:none">0</span>
    </button>
  </div>
  <div class="results-bar">
    <span class="results-count" id="rCount"></span>
    <div class="results-badges" id="rBadges"></div>
  </div>
  <div class="programs-list" id="list">
    <div class="loading"><div class="spinner"></div><p>Loading programs...</p></div>
  </div>
</div>

<script>
// =====================================================================
// PASTE YOUR WIX MEDIA MANAGER FILE URL BELOW (between the quotes):
// =====================================================================
var FILE_URL = 'https://c5f79bdc-bc6f-44e7-b4a4-2963da50fdc1.usrfiles.com/ugd/c5f79b_870f7a0f24ca478887a3fc9e1fa22453.xlsx';
// =====================================================================

// Try direct first (fastest, works if same-origin), then CORS proxies as fallback
var FETCH_URLS = [
  FILE_URL,
  'https://corsproxy.io/?' + encodeURIComponent(FILE_URL),
  'https://api.allorigins.win/raw?url=' + encodeURIComponent(FILE_URL)
];

// Dynamic color palette for levels — auto-assigns colors to whatever levels exist in data
var LEVEL_COLORS = [
  {bg:'#6b8f5e',fg:'#fff',light:'#e8f0e5',text:'#3a5e30'},
  {bg:'#4a6e3f',fg:'#fff',light:'#e5eee2',text:'#2d5227'},
  {bg:'#a0b89a',fg:'#333',light:'#f0efe8',text:'#5a5a4a'},
  {bg:'#8a9e85',fg:'#fff',light:'#e8ece6',text:'#3a4a35'},
  {bg:'#7d9b78',fg:'#fff',light:'#eef3ec',text:'#4a6e3f'},
  {bg:'#5a7d4f',fg:'#fff',light:'#eaf2e7',text:'#3a5e30'},
  {bg:'#b8c4b3',fg:'#333',light:'#f2f2ee',text:'#666'},
  {bg:'#6a8a5c',fg:'#fff',light:'#ebf1e8',text:'#3d5f31'}
];
var levelStyleCache = {};
function getLevelStyle(level) {
  if (!level) return LEVEL_COLORS[0];
  if (!levelStyleCache[level]) {
    var idx = Object.keys(levelStyleCache).length % LEVEL_COLORS.length;
    levelStyleCache[level] = LEVEL_COLORS[idx];
  }
  return levelStyleCache[level];
}

// Typo fixer for languages — add common typos here
var TYPO_FIX = {'fench':'French','frech':'French','englisch':'English','deutsch':'German','italienisch':'Italian','francais':'French','français':'French'};
function fixTypo(s){if(!s)return '';var t=s.trim(),low=t.toLowerCase();return TYPO_FIX[low]||t;}

// SVG icons inline
var SVG_PRACT1 = '<svg width="22" height="22" viewBox="0 0 28 28" fill="none" stroke="#4a7a5a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7V5a4 4 0 0 1 8 0v2"/><rect x="5" y="7" width="18" height="18" rx="2.5"/><rect x="8" y="15" width="12" height="8" rx="1.5"/><line x1="14" y1="12" x2="14" y2="15"/><circle cx="14" cy="11" r="1.2"/></svg>';
var SVG_PRACT2 = '<svg width="34" height="22" viewBox="0 0 44 28" fill="none" stroke="#4a7a5a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7V5a4 4 0 0 1 8 0v2"/><rect x="4" y="7" width="18" height="18" rx="2.5"/><rect x="7" y="15" width="12" height="8" rx="1.5"/><line x1="13" y1="12" x2="13" y2="15"/><circle cx="13" cy="11" r="1.2"/><path d="M27 7V5a4 4 0 0 1 8 0v2"/><rect x="22" y="7" width="18" height="18" rx="2.5"/><rect x="25" y="15" width="12" height="8" rx="1.5"/><line x1="31" y1="12" x2="31" y2="15"/><circle cx="31" cy="11" r="1.2"/></svg>';
var SVG_INTER1 = '<svg width="24" height="22" viewBox="0 0 32 28" fill="none" stroke="#8a7d4a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="4" r="2.8"/><path d="M12.5 10.5a3.5 3.5 0 0 1 7 0"/><circle cx="6" cy="19" r="2.8"/><path d="M2.5 25.5a3.5 3.5 0 0 1 7 0"/><circle cx="26" cy="19" r="2.8"/><path d="M22.5 25.5a3.5 3.5 0 0 1 7 0"/><line x1="13" y1="9" x2="8.5" y2="16" stroke-dasharray="2 2"/><line x1="19" y1="9" x2="23.5" y2="16" stroke-dasharray="2 2"/><line x1="10" y1="20.5" x2="22" y2="20.5" stroke-dasharray="2 2"/></svg>';
var SVG_INTER2 = '<svg width="30" height="22" viewBox="0 0 40 28" fill="none" stroke="#8a7d4a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="3.5" r="2.5"/><path d="M9.5 9.5a3.5 3.5 0 0 1 7 0"/><circle cx="27" cy="3.5" r="2.5"/><path d="M23.5 9.5a3.5 3.5 0 0 1 7 0"/><circle cx="5" cy="18" r="2.5"/><path d="M1.5 24a3.5 3.5 0 0 1 7 0"/><circle cx="20" cy="18" r="2.5"/><path d="M16.5 24a3.5 3.5 0 0 1 7 0"/><circle cx="35" cy="18" r="2.5"/><path d="M31.5 24a3.5 3.5 0 0 1 7 0"/><line x1="13" y1="10" x2="5" y2="15" stroke-dasharray="2 2"/><line x1="13" y1="10" x2="20" y2="15" stroke-dasharray="2 2"/><line x1="27" y1="10" x2="20" y2="15" stroke-dasharray="2 2"/><line x1="27" y1="10" x2="35" y2="15" stroke-dasharray="2 2"/><line x1="9" y1="19.5" x2="16" y2="19.5" stroke-dasharray="2 2"/><line x1="24" y1="19.5" x2="31" y2="19.5" stroke-dasharray="2 2"/><line x1="13" y1="10" x2="35" y2="15" stroke-dasharray="2 2" opacity="0.35"/><line x1="27" y1="10" x2="5" y2="15" stroke-dasharray="2 2" opacity="0.35"/></svg>';

var DATA=[], exp={};
var favMode=false;
var FAVS={}; try{FAVS=JSON.parse(localStorage.getItem('wwf_sg_favs')||'{}');}catch(e){FAVS={};}
function saveFavs(){try{localStorage.setItem('wwf_sg_favs',JSON.stringify(FAVS));}catch(e){}}
function getFavKey(x){return x.n+'|||'+x.u;} // unique key: program + university
function toggleFav(idx,ev){ev.stopPropagation();var k=getFavKey(DATA[idx]);if(FAVS[k])delete FAVS[k];else FAVS[k]=1;saveFavs();render();}
function isFav(x){return !!FAVS[getFavKey(x)];}
function toggleFavMode(){favMode=!favMode;$('btnFavToggle').classList.toggle('active',favMode);$('favLabel').textContent=favMode?'Show all programs':'Show only favorites';render();}
function updateFavCount(){var c=Object.keys(FAVS).length;$('favCount').textContent=c;$('favCount').style.display=c>0?'inline':'none';$('favBar').classList.toggle('hidden',c===0);}
function $(id){return document.getElementById(id)}

async function fetchData() {
  for (var i = 0; i < FETCH_URLS.length; i++) {
    try {
      var t0 = Date.now();
      console.log('Try ' + (i+1) + '/' + FETCH_URLS.length + (i===0?' (direct)':' (proxy)'));
      var resp = await fetch(FETCH_URLS[i]);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var buf = await resp.arrayBuffer();
      if (buf.byteLength < 500) throw new Error('File too small');
      console.log('OK! ' + buf.byteLength + ' bytes in ' + (Date.now()-t0) + 'ms');
      processXlsx(buf);
      return;
    } catch(e) { console.warn('Attempt ' + (i+1) + ' failed:', e.message); }
  }
  showError('Could not load data file. Please try again later.');
}

function processXlsx(buf) {
  var wb = XLSX.read(buf, {type:'array'});
  var ws = wb.Sheets[wb.SheetNames[0]];
  var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});

  if (rows.length < 2) { showError('No data found'); return; }
  var headers = rows[0].map(function(h){return String(h||'').toLowerCase().trim();});
  console.log('Headers:', headers);

  var CM = {};
  headers.forEach(function(c,j){
    if (!c) return;
    if (c.indexOf('program')>=0 && CM.prog===undefined) CM.prog=j;
    else if (c.indexOf('university type')>=0) CM.utype=j;
    else if (c.indexOf('university')>=0 && CM.uni===undefined) CM.uni=j;
    else if (c==='level') CM.level=j;
    else if (c.indexOf('disciplin')>=0) CM.disc=j;
    else if (c.indexOf('main lang')>=0) CM.mainLang=j;
    else if (c.indexOf('additional lang')>=0) CM.addLang=j;
    else if (c==='language') CM.langOld=j;
    else if (c.indexOf('description')>=0 && c.indexOf('icon')<0) CM.desc=j;
    else if (c.indexOf('practical info')>=0) CM.pract=j;
    else if (c.indexOf('region')>=0) CM.region=j;
    else if (c.indexOf('icons des')>=0 || c.indexOf('icon desc')>=0) CM.iconDesc=j;
    else if (c.indexOf('website')>=0 || c.indexOf('link')>=0) CM.link=j;
  });
  if (CM.mainLang===undefined && CM.langOld!==undefined) CM.mainLang=CM.langOld;
  console.log('Mapping:', JSON.stringify(CM));

  DATA = [];
  for (var k=1; k<rows.length; k++) {
    var r = rows[k];
    var prog = String(r[CM.prog]||'').trim();
    if (!prog) continue;

    var addLang = CM.addLang!==undefined ? String(r[CM.addLang]||'').trim() : '';
    if (addLang) addLang = addLang.split(',').map(function(s){return fixTypo(s);}).filter(Boolean).join(', ');

    DATA.push({
      n:prog,
      u:String(r[CM.uni]||'').trim(),
      t:String(r[CM.utype]||'').trim(),
      l:String(r[CM.level]||'').trim(),
      d:String(r[CM.disc]||'').trim(),
      mainLang:fixTypo(String(r[CM.mainLang]||'')),
      addLang:addLang,
      desc:CM.desc!==undefined?String(r[CM.desc]||'').trim():'',
      p:CM.pract!==undefined?String(r[CM.pract]||'').trim():'',
      reg:CM.region!==undefined?String(r[CM.region]||'').trim():'',
      iconDesc:(CM.iconDesc!==undefined?String(r[CM.iconDesc]||'').trim():'').toLowerCase(),
      link:CM.link!==undefined?String(r[CM.link]||'').trim():''
    });
  }

  if (!DATA.length){showError('No programs found.');return;}
  console.log('Loaded', DATA.length, 'programs');
  populateFilters();
  render();
}

function showError(msg){$('list').innerHTML='<div class="error-box"><h3>Error</h3><p>'+msg+'</p></div>';}
function uniq(a){var s={},r=[];for(var i=0;i<a.length;i++){var v=a[i];if(v&&!s[v]){s[v]=1;r.push(v);}}return r.sort();}
function fill(id,opts){var s=$(id);while(s.options.length>1)s.remove(1);for(var i=0;i<opts.length;i++){var o=document.createElement('option');o.value=opts[i];o.textContent=opts[i];s.appendChild(o);}}
function splitTrim(str){if(!str)return[];return str.split(',').map(function(s){return s.trim();}).filter(Boolean);}
function fillMulti(cid,opts,name){$(cid).innerHTML=opts.map(function(o){return '<label><input type="checkbox" name="'+name+'" value="'+o+'" onchange="onMultiChange(\''+name+'\')"> '+o+'</label>';}).join('');}
function getChecked(name){var r=[];document.querySelectorAll('input[name="'+name+'"]:checked').forEach(function(cb){r.push(cb.value);});return r;}
function uncheckAll(name){document.querySelectorAll('input[name="'+name+'"]').forEach(function(cb){cb.checked=false;});}
function onMultiChange(name){var v=getChecked(name),lid=(name==='disc')?'msDiscLabel':(name==='region')?'msRegionLabel':'msAddLangLabel';var def=(name==='disc'||name==='region')?'All':'Any';$(lid).textContent=!v.length?def:v.length===1?v[0]:v.length+' selected';render();}
function toggleDrop(id){var d=$(id).querySelector('.multi-dropdown'),o=d.classList.contains('open');document.querySelectorAll('.multi-dropdown').forEach(function(dd){dd.classList.remove('open');});if(!o)d.classList.add('open');}
document.addEventListener('click',function(e){if(!e.target.closest('.multi-select'))document.querySelectorAll('.multi-dropdown').forEach(function(dd){dd.classList.remove('open');});});

function populateFilters(){
  var levels=[],discs=[],types=[],mainLangs=[],regions=[];
  DATA.forEach(function(x){
    levels.push(x.l);types.push(x.t);if(x.reg)regions.push(x.reg);
    splitTrim(x.d).forEach(function(dd){discs.push(dd);});
    if(x.mainLang)mainLangs.push(x.mainLang);
  });
  fill('fLevel',uniq(levels));fill('fType',uniq(types));
  fillMulti('msRegionDrop',uniq(regions),'region');
  fill('fMainLang',uniq(mainLangs));
  fillMulti('msDiscDrop',uniq(discs),'disc');
}

$('fMainLang').addEventListener('change',function(){
  var wrap=$('langSubWrap'),val=this.value;
  if(val){
    var adds=[];
    DATA.forEach(function(x){if(x.mainLang===val&&x.addLang)splitTrim(x.addLang).forEach(function(a){if(a)adds.push(a);});});
    var u=uniq(adds);
    if(u.length){fillMulti('msAddLangDrop',u,'addLang');wrap.classList.add('visible');$('msAddLangLabel').textContent='Any';}
    else{wrap.classList.remove('visible');uncheckAll('addLang');}
  }else{wrap.classList.remove('visible');uncheckAll('addLang');}
  render();
});

function getF(){return{level:$('fLevel').value,type:$('fType').value,regions:getChecked('region'),q:$('search').value.toLowerCase(),discs:getChecked('disc'),mainLang:$('fMainLang').value,addLangs:getChecked('addLang')};}

function doFilter(){
  var f=getF(),r=[];
  DATA.forEach(function(x){
    if(favMode&&!isFav(x))return;
    if(f.level&&x.l!==f.level)return;
    if(f.type&&x.t!==f.type)return;
    if(f.regions.length){if(f.regions.indexOf(x.reg)<0)return;}
    if(f.discs.length){var xd=splitTrim(x.d),found=false;f.discs.forEach(function(fd){if(xd.indexOf(fd)>=0)found=true;});if(!found)return;}
    if(f.mainLang&&x.mainLang!==f.mainLang)return;
    if(f.addLangs.length){var al=splitTrim(x.addLang),af=false;f.addLangs.forEach(function(fa){if(al.indexOf(fa)>=0)af=true;});if(!af)return;}
    if(f.q&&x.n.toLowerCase().indexOf(f.q)<0&&x.u.toLowerCase().indexOf(f.q)<0&&x.desc.toLowerCase().indexOf(f.q)<0&&x.d.toLowerCase().indexOf(f.q)<0)return;
    r.push(x);
  });
  return r;
}

function clearAll(){
  ['fLevel','fType','fMainLang','search'].forEach(function(id){$(id).value='';});
  document.querySelectorAll('input[type="checkbox"]').forEach(function(cb){cb.checked=false;});
  $('msDiscLabel').textContent='All';$('msRegionLabel').textContent='All';$('msAddLangLabel').textContent='Any';
  $('langSubWrap').classList.remove('visible');exp={};render();
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function buildItIcons(x) {
  var ic = x.iconDesc; if (!ic) return '';
  var h = '<div class="it-icons">';
  var hasPract = false, hasInter = false;

  if (ic.indexOf('strong practical') >= 0) {
    h += '<span class="it-icon it-icon-pract">' + SVG_PRACT2 + '<span class="it-tip">Strong Practical Focus</span></span>';
    hasPract = true;
  } else if (ic.indexOf('practical') >= 0) {
    h += '<span class="it-icon it-icon-pract">' + SVG_PRACT1 + '<span class="it-tip">Practical Inputs</span></span>';
    hasPract = true;
  }

  if (ic.indexOf('highly interdisciplin') >= 0) {
    h += '<span class="it-icon it-icon-inter">' + SVG_INTER2 + '<span class="it-tip">Highly Interdisciplinary</span></span>';
    hasInter = true;
  } else if (ic.indexOf('interdisciplin') >= 0) {
    h += '<span class="it-icon it-icon-inter">' + SVG_INTER1 + '<span class="it-tip">Interdisciplinary</span></span>';
    hasInter = true;
  }

  if (!hasPract && !hasInter) return '';
  return h + '</div>';
}

function render(){
  var r=doFilter(),f=getF(),ac=0;
  if(f.level)ac++;if(f.discs.length)ac++;if(f.type)ac++;if(f.mainLang)ac++;if(f.addLangs.length)ac++;if(f.regions.length)ac++;
  var fa=$('fActions');
  if(ac){fa.style.display='flex';$('fCount').textContent=ac+' filter'+(ac>1?'s':'')+' active';}else fa.style.display='none';
  $('rCount').textContent=r.length+' program'+(r.length!==1?'s':'')+' found';

  var bh='',lvCounts={};
  r.forEach(function(x){lvCounts[x.l]=(lvCounts[x.l]||0)+1;});
  Object.keys(lvCounts).forEach(function(lv){var st=getLevelStyle(lv);bh+='<span class="badge" style="background:'+st.bg+';color:'+st.fg+'">'+lv+': '+lvCounts[lv]+'</span>';});
  $('rBadges').innerHTML=bh;

  if(!r.length){
    var emptyMsg=favMode?'<div class="empty"><div class="ico">⭐</div><h3>No favorites yet</h3><p>Click the star on any program to add it to your favorites</p></div>'
      :'<div class="empty"><div class="ico">🌱</div><h3>No programs found</h3><p>Try adjusting your filters</p></div>';
    $('list').innerHTML=emptyMsg;return;
  }

  var html='';
  r.forEach(function(x){
    var idx=DATA.indexOf(x),s=getLevelStyle(x.l),o=!!exp[idx];
    var tl=x.t.toLowerCase(),isFH=tl.indexOf('applied')>=0||tl.indexOf('fh')>=0||tl.indexOf('fachhoch')>=0;
    var tc=isFH?'type-fh':'type-uni';
    var dh='';splitTrim(x.d).forEach(function(dd){dh+='<span class="disc-tag">'+esc(dd)+'</span>';});
    var langHtml=esc(x.mainLang);if(x.addLang)langHtml+='<span class="tag-lang-add"> + '+esc(x.addLang)+'</span>';
    var itHtml=buildItIcons(x);
    var titleHtml = x.link
      ? '<a href="'+esc(x.link)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(x.n)+'</a>'
      : esc(x.n);
    var det='';
    if(o){
      det='<div class="card-details">';
      if(x.desc)det+='<p class="card-desc">'+esc(x.desc)+'</p>';
      if(x.p)det+='<div class="card-pract"><span class="card-pract-lbl">Practical Information</span><p>'+esc(x.p)+'</p></div>';
      det+='</div>';
    }
    var faved=isFav(x);
    var starHtml='<button class="fav-star'+(faved?' active':'')+'" onclick="toggleFav('+idx+',event)" title="'+(faved?'Remove from favorites':'Add to favorites')+'"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>';
    html+='<div class="program-card'+(faved?' faved':'')+'" onclick="tog('+idx+')"><div class="card-inner" style="border-left:4px solid '+s.bg+'">'
      +starHtml
      +'<div class="card-top"><div class="card-main">'
      +'<h3 class="card-title">'+titleHtml+'</h3>'
      +'<div class="card-uni-row"><span class="card-uni">'+esc(x.u)+'</span><span class="type-badge '+tc+'">'+esc(x.t)+'</span></div>'
      +'</div><div class="card-tags">'
      +'<span class="tag-level" style="background:'+s.light+';color:'+s.text+'">'+esc(x.l)+'</span>'
      +'<span class="tag-lang">'+langHtml+'</span>'
      +'</div></div>'
      +'<div class="card-bottom-row"><div class="card-discs">'+dh+'</div>'+itHtml+'</div>'
      +det
      +'<div class="card-hint">'+(o?'&#9650; Click to collapse':'&#9660; Click for details')+'</div>'
      +'</div></div>';
  });
  $('list').innerHTML=html;
  updateFavCount();
}

function tog(i){exp[i]=!exp[i];render();}
document.querySelectorAll('.filter-select').forEach(function(s){s.addEventListener('change',render);});
$('search').addEventListener('input',render);

fetchData();
</script>
</body>
</html>
